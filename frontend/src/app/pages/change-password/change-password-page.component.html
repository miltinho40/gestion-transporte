<section class="password-page">
  <header class="page-heading">
    <div>
      <h1>Cambiar clave</h1>
      <p>Actualiza la clave de acceso de {{ userName }}.</p>
    </div>
  </header>

  <form class="password-form" [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-title">
      <span class="form-icon"><svg lucideKeyRound size="20"></svg></span>
      <div>
        <strong>Seguridad de la cuenta</strong>
        <span>Usa una clave de al menos 8 caracteres.</span>
      </div>
    </div>

    @if (message()) {
      <div class="alert alert-success py-2" [appAutoDismissAlert]="message()">{{ message() }}</div>
    }

    @if (error()) {
      <div class="alert alert-danger py-2" [appAutoDismissAlert]="error()">{{ error() }}</div>
    }

    <div class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="current_password">Clave actual</label>
        <input
          id="current_password"
          class="form-control"
          type="password"
          autocomplete="current-password"
          formControlName="current_password"
        />
      </div>

      <div class="col-md-4">
        <label class="form-label" for="new_password">Nueva clave</label>
        <input
          id="new_password"
          class="form-control"
          type="password"
          autocomplete="new-password"
          formControlName="new_password"
        />
      </div>

      <div class="col-md-4">
        <label class="form-label" for="confirm_password">Confirmar nueva clave</label>
        <input
          id="confirm_password"
          class="form-control"
          type="password"
          autocomplete="new-password"
          formControlName="confirm_password"
        />
      </div>
    </div>

    <div class="actions">
      <button type="submit" class="btn btn-primary d-inline-flex align-items-center gap-2" [disabled]="loading()">
        <svg lucideSave size="18"></svg>
        @if (loading()) {
          Guardando...
        } @else {
          Guardar clave
        }
      </button>
    </div>
  </form>
</section>
