<div class="d-flex justify-content-between align-items-start gap-3 mb-3">
  <div>
    <h1 class="h3 mb-1">Transporte de proveedores</h1>
    <p class="text-secondary mb-0">Viajes tercerizados, cobros a clientes y pagos a proveedores.</p>
  </div>
  <button
    type="button"
    class="btn btn-primary d-inline-flex align-items-center gap-2"
    (click)="openCreate()"
  >
    <svg lucidePlus size="17"></svg>
    Nuevo
  </button>
</div>

@if (error() && !formOpen()) {
  <div class="alert alert-danger" [appAutoDismissAlert]="error()">{{ error() }}</div>
}

@if (message()) {
  <div class="alert alert-success" [appAutoDismissAlert]="message()">{{ message() }}</div>
}

<app-proveedor-trip-list
  [filters]="filters"
  [rows]="rows()"
  [clientes]="clientes()"
  [proveedores]="proveedores()"
  [selectedIds]="selectedIds()"
  [selectedClientIds]="selectedClientIds()"
  [selectedProviderIds]="selectedProviderIds()"
  [loading]="loading()"
  [pagination]="pagination()"
  [deletingId]="deletingId()"
  [guideEditTripId]="guideEditTripId()"
  [guideInput]="guideInput()"
  [detailOpen]="detailOpen()"
  [detailRowId]="detailRowId()"
  (clientIdsChange)="setSelectedClients($event)"
  (providerIdsChange)="setSelectedProviders($event)"
  (pageChange)="changePage($event)"
  (limitChange)="changeLimit($event)"
  (selectionChanged)="toggleSelection($event.row, $event.checked)"
  (allSelectionChanged)="toggleAllVisible($event)"
  (guideInputChange)="guideInput.set($event)"
  (guideCancelled)="cancelGuideEdit()"
  (rowAction)="handleRowAction($event)"
  (bulkAction)="handleBulkAction($event)"
/>
@if (detailOpen()) {
  <app-proveedor-viaje-detail-panel
    [viaje]="detail.viaje()"
    [loading]="detail.loading()"
    [error]="detail.error()"
    (closed)="detail.close()"
  />
}
@if (editorRequest(); as request) {
  <app-proveedor-viaje-editor-modal
    [request]="request"
    [clientes]="clientes()"
    [proveedores]="proveedores()"
    [tarifasRuta]="tarifasRuta()"
    [catalogError]="error()"
    (closed)="closeForm()"
    (saved)="formSaved($event)"
  />
}
